openapi: 3.0.3
info:
  title: Udharo Tracker API
  version: 1.0.0
  description: This is an API for Udharo Tracker (Debt Management Apps)
paths:
  /api/v1/auth/token/:
    post:
      operationId: api_v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/v1/auth/token/blacklist/:
    post:
      operationId: api_v1_auth_token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: api_v1_auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/v1/customers/:
    get:
      operationId: api_v1_customers_list
      tags:
      - Customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: api_v1_customers_create
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Customer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Customer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/customers/{customer_id}/credit-score/:
    get:
      operationId: api_v1_customers_credit_score_retrieve
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditScore'
          description: ''
  /api/v1/customers/{customer_id}/credit-score/history/:
    get:
      operationId: api_v1_customers_credit_score_history_list
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditScore'
          description: ''
  /api/v1/customers/{customer_id}/reminders/:
    get:
      operationId: api_v1_customers_reminders_list
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Reminder Log
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReminderLog'
          description: ''
    post:
      operationId: api_v1_customers_reminders_create
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Reminder Log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              RequestExample:
                value:
                  note: Called customer, promised to pay by Friday
                summary: Request example
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderLog'
          description: ''
  /api/v1/customers/{customer_id}/statement/:
    get:
      operationId: api_v1_customers_statement_retrieve
      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Customer Statement
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ExampleResponse:
                  value:
                    customer:
                      id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      name: Ram Sharma
                      phone: '+9779812345678'
                    summary:
                      total_udharo: 5000.0
                      total_paid: 2000.0
                      outstanding_balance: 3000.0
                    udharo_entries: []
                    transactions:
                    - id: 6f9619ff-8b86-d011-b42d-00c04fc964ff
                      type: udharo
                      amount: 2000.0
                      note: Rice and oil
                      date: '2026-07-01T09:15:00+05:45'
                      balance: 2000.0
                    - id: 9b2e1a4c-1234-4a3b-8c9d-abcdef123456
                      type: payment
                      amount: 500.0
                      note: Partial payment
                      date: '2026-07-10T18:00:00+05:45'
                      balance: 1500.0
                  summary: Example response
          description: Customer profile, running totals, full udharo entries, and
            a merged/sorted transaction ledger with running balance.
  /api/v1/customers/{id}/:
    get:
      operationId: api_v1_customers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    put:
      operationId: api_v1_customers_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Customer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Customer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    patch:
      operationId: api_v1_customers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    delete:
      operationId: api_v1_customers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Customers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ledger/dashboard/:
    get:
      operationId: api_v1_ledger_dashboard_retrieve
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ExampleResponse:
                  value:
                    total_credit_given: 42000.0
                    total_recovered: 26800.0
                    total_pending: 15200.0
                    todays_udharo: 1500.0
                    top_5_debtors:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      name: Ram Sharma
                      phone: '+9779812345678'
                      total_udharo: 5000.0
                      total_paid: 2000.0
                      outstanding_balance: 3000.0
                      last_transaction: '2026-07-15T10:30:00+05:45'
                      risk: yellow
                  summary: Example response
          description: Shop-wide dashboard totals plus the top 5 customers by outstanding
            balance.
  /api/v1/ledger/monthly-report/:
    get:
      operationId: api_v1_ledger_monthly_report_retrieve
      parameters:
      - in: query
        name: month
        schema:
          type: integer
        description: Month 1-12 (optional — omit for yearly summary)
      - in: query
        name: year
        schema:
          type: integer
        description: Year (required)
        required: true
      tags:
      - Monthly Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                YearlySummary(noMonthParam):
                  value:
                    year: 2026
                    months:
                    - month: 7
                      month_name: July
                      total_udharo: 8000.0
                      total_payments: 5000.0
                      net: 3000.0
                      entry_count: 4
                      payment_count: 3
                    yearly_totals:
                      total_udharo: 42000.0
                      total_payments: 26800.0
                      net: 15200.0
                  summary: Yearly summary (no month param)
                MonthDetail(monthParamGiven):
                  value:
                    year: 2026
                    month: 7
                    month_name: July
                    daily_breakdown:
                    - date: '2026-07-15'
                      total_udharo: 1500.0
                      total_payments: 500.0
                      net: 1000.0
                      entry_count: 1
                      payment_count: 1
                    totals:
                      total_udharo: 8000.0
                      total_payments: 5000.0
                      net: 3000.0
                  summary: Month detail (month param given)
          description: Yearly summary (12 months) when `month` is omitted, or a daily
            breakdown when `month` is given.
  /api/v1/ledger/summary/:
    get:
      operationId: api_v1_ledger_summary_retrieve
      tags:
      - Ledger Summary
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ExampleResponse:
                  value:
                    total_outstanding: 15200.0
                    customers_summary:
                    - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      name: Ram Sharma
                      phone: '+9779812345678'
                      total_udharo: 5000.0
                      total_paid: 2000.0
                      outstanding_balance: 3000.0
                      last_transaction: '2026-07-15T10:30:00+05:45'
                      risk: yellow
                  summary: Example response
          description: Total outstanding balance across all customers, with a per-customer
            breakdown and risk level.
  /api/v1/payments/:
    get:
      operationId: api_v1_payments_list
      parameters:
