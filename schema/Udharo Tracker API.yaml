components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CreditScore:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        calculated_at:
          type: string
          format: date-time
          readOnly: true
        score:
          type: integer
          readOnly: true
        risk_level:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          readOnly: true
      required:
      - calculated_at
      - customer
      - id
      - risk_level
      - score
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 15
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    GenderEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
    NullEnum:
      enum:
      - null
    PatchedCustomer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 15
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          readOnly: true
        customer_id:
          type: string
          format: uuid
          writeOnly: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedShop:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 15
        address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUdharoEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          readOnly: true
        customer_id:
          type: string
          format: uuid
          writeOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/UdharoEntryItem'
        total_amount:
          type: string
          readOnly: true
        note:
          type: string
        is_settled:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        settled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PatchedUserProfileSerializers:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        profile_picture:
          type: string
          format: uri
          nullable: true
        phone_number:
          type: string
          maxLength: 15
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PatchedUserUpdatePassword:
