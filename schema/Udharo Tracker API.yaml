          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Payment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    patch:
      operationId: api_v1_payments_partial_update
      parameters:
      - in: query
        name: customer_id
        schema:
          type: string
        description: Filter payments by customer UUID.
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    delete:
      operationId: api_v1_payments_destroy
      parameters:
      - in: query
        name: customer_id
        schema:
          type: string
        description: Filter payments by customer UUID.
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Payments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
